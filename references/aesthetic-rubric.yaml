# ============ 渲染层 R：需真实渲染的几何判据（v1.1 新增，judgeability 由实现决定）============
# 这三个判据的输入不是 CSS 文本，而是「渲染后的可见几何」—— 依据 plumb 的核心判断：
#   for **rendered** websites, **not the code behind it**。
# 渲染色取数器：`scripts/geom-probe.js`（页面侧提取器，**只读 DOM**），由任一 CDP 驱动注入执行。
# 校验器**不**内建 CDP —— 不在校验器里重复实现浏览器驱动，只消费 geom.json（契约见 extract_geom）。
# 取数示例（以 ui库 `scripts/shoot-page.mjs` 为例，它先跑 --prep 再跑 --eval）：
#   node scripts/shoot-page.mjs --file=<page.html> \
#        --prep="$(cat <skill>/scripts/geom-probe.js)" \
#        --eval="return window.__geomProbe();" > geom.json
#   python <skill>/scripts/check_aesthetics.py --rubric <判据集> --css a.css --geom geom.json
# ⚠️ 2026-09-26 更正：本段此前写作「--render 模式」——**该模式从未存在**（悬空承诺），
#    实际接口是 `--geom`（消费已产出的渲染色）。文档与实现不一致与「声称有、实际不可达」同源，已改。

  - id: R1
    dimension: "版式结构"
    name: "近乎对齐的兄弟元素"
    judgeability: machine
    check: near_alignment
    params: { tolerance_px: 2, min_cluster: 2, noise_px: 0.5 }
    source: "plumb edge/near-alignment（兄弟元素四条边聚类；簇内成员到簇心 delta **超过噪声地板、且不超过容差**即报告）。原话：Near-aligned edges are the visual signature of the design system losing focus…the eye notices, even when nobody can name what is off —— 关键在 **the eye notices**：亚像素差眼睛看不出来，故设噪声地板。"
    applies_to: [ui, ppt]
    note: "需渲染。无渲染色（未提供 --geom 产物）时判 SKIP，理由是「未检测」，不是通过；**空节点集同样判 SKIP**（没数据不得冒充没问题）。⚠️ v1.2.2 两处修正（真实 deck 页实测暴露）：① 簇心原用 `int()` 截断 ⇒ 每个成员被凭空算出差 ≤1px（实测把 4 条完全重合的右边报成「差 0.39px」×10 处，**是判据在造信号**），已改浮点均值；② 新增噪声地板 `noise_px`（默认 0.5，与容差同单位）——缩放画布 `transform:scale` 会把浏览器 0.1px 级舍入放大到设计像素的零点几 px。地板 ≥ 容差 ⇒ SKIP（配置自相矛盾不许静默变成永不报警）。"

  - id: R2
    dimension: "统一性"
    name: "兄弟元素尺寸一致"
    judgeability: machine
    check: sibling_consistency
    params: { kind: height, max_drift_ratio: 0.02, min_group: 3, row_overlap: 0.8 }
    source: "plumb sibling/height-consistency 与 sibling/padding-consistency（**同一视觉行内**，兄弟元素偏离**组中位数**即报告）"
    applies_to: [ui, ppt]
    note: "需渲染。无渲染色时 SKIP。⚠️ v1.2.2 **分组修正**：原实现只按 `parent` 分组 ⇒ 真实封面里 eyebrow/title/subtitle/rule/meta 这 5 个**竖排**兄弟被当成一行互比高度（实测报出「title 比中位数高 528%」——那不是缺陷，那是把标题和分割线当成了同一行的卡片）。现先判「**并排同行**」再比：水平区间不相交（中间可有沟槽）∧ 垂直重叠 ≥ `row_overlap`×min(两高)。**找不到可比的并排行 ⇒ SKIP**，不是 PASS（「没得比」≠「比过且没问题」）。"

  - id: R3
    dimension: "版式结构"
    name: "垂直韵律落格"
    judgeability: machine
    check: baseline_rhythm
    params: { tolerance_px: 1 }
    source: "plumb baseline/rhythm（文字基线必须落在**配置的**垂直韵律网格上 —— 网格间距是设计系统的声明量，不是通用常数）"
    applies_to: [ui, ppt]
    note: "需渲染。⚠️ v1.4 **三种 SKIP 分开措辞**（原先混在一句里，读不出「有没有救」）：① 缺渲染色 ⇒ SKIP「未检测」；② 渲染色里无可测文本节点 ⇒ SKIP「无数据」；③ **未声明韵律网格 ⇒ SKIP「结构性不适用」**。⚠️ 第 ③ 种在本产物上是**正确终态，不是待办**：ui库 `src/deck/themes/schema.json#spacing` 明确写着「34 套子键自由命名且数量庞大……本层不强行归并」—— 该设计系统**没有** baseline 网格，所以 R3 对它**永久不适用**，而不是「等哪天声明了再开」。取证：硬套 8px 会把整页判成「7/7 文本全部离格」，那是**判据凭空发明契约**。本条的可达性已由 v1.2.2 的阴性对照证明（声明 8px 且干净 ⇒ PASS；声明 8px 且离格 4px ⇒ FAIL），即**判据有牙齿，只是本产物不是它的适用对象**。要启用请在产物侧声明或用 override 提供该产物实际采用的行距网格。"

  - id: R4
    dimension: "版式结构"
    name: "文本被后绘制的实心元素遮挡"
    judgeability: machine
    check: geometry_occlusion
    params: { opaque_alpha: 0.95, cover_ratio: 0.8 }
    source: "cathrynlavery/diagram-design@d1376371965f513d99cc9ec388835d255c5c88d5 的设计纪律「文本/遮罩层不被其后绘制的实心元素覆盖」（图示设计模式 §6 F5）。⚠️ 阈值 `opaque_alpha` / `cover_ratio` 是**本仓默认档**（可任务级 override 覆盖），**不是**从对方设计系统搬来的数值 —— 本条**只搬规则、不搬阈值**。"
    applies_to: [ui, ppt]
    note: "需渲染。判据：对每个**可见·有 rect·承载文字**的节点，若存在**文档序在其后**、`bgAlpha ≥ opaque_alpha`（实心）、且其 rect 覆盖该文本 rect 的比例 ≥ `cover_ratio` 的节点 ⇒ FAIL（命中项逐条报出）。⚠️ **三种 SKIP 分开措辞**：① 缺渲染色（未提供 `--geom`）⇒「未检测」；② 渲染色为空（`nodes=[]`）⇒「无数据」；③ **缺 `bgAlpha` 字段（旧版 `geom-probe.js` 产出的 geom.json）⇒「结构性不适用」** —— 要启用须用新版探针重取。**空输入与缺字段都不得判 PASS**。⚠️ **诚实边界（三条）**：① 绘制先后用**文档序 `i`** 近似层叠序 —— 文档序遍历下**祖先必先于后代**，故「父容器背景盖住子文本」这类必然误报**不会发生**；但**不解析 `z-index`** ⇒ 靠定位/层叠上下文改变绘制序的版面**不在射程内**。② 本条报出的是**几何事实**（有实心元素覆盖了文本），**是否为刻意遮挡（模态框、合法遮罩层）由人审判断** —— 本判据不足以区分「缺陷」与「设计」。③ 可达性由**阴性/阳性/边界三态对照**证明（实心元素覆盖文本 ⇒ FAIL；无覆盖 ⇒ PASS；半透明覆盖 ⇒ PASS；祖先覆盖 ⇒ PASS），即**判据有牙齿且不误杀**。"

