# 审美判据集（Aesthetic Rubric）
# 任务：AI 审美提升方案 · 2026-09-26
# 用途：把「好看」拆成可枚举、可机器校验的判据。校验器 scripts/check_aesthetics.py 直接消费本文件。
#
# 设计原则
#   1. 每条判据的阈值必须有来源（source 字段），不得凭空设定
#   2. 判据必须标注「可判定性」，把「通过 / 未检测 / 无法判定」分开报
#   3. 判据的**适用范围**（applies_to）必须与 source 的语义一致 —— 源讲「画面内」的，
#      不得声明适用于 token 表
#   4. 阈值可被具体产物覆盖（见 override 用法），但覆盖必须留痕
#
# 可判定性三档（对应 SOUL.md「绿有三种」）
#   machine — 可从产物（CSS/HTML）直接量出，校验器自动判
#   spec    — 需从 spec 文档解析声明值，校验器半自动判
#   manual  — 机器判不了，显式登记为人审点（不是「通过」，是「未检测」）
#   external— 由外部工具判定，本校验器不重复实现
#
# ⭐ v1.1（2026-09-26）变更摘要（逐条可复核，旧判定值一个未改）
#   A. 修一处**真 bug**：G7 原先把 caption/body/h/display 的**全部**字号混在一个序列里
#      算相邻阶比 ⇒ 21/21 套全 FAIL，其中 **15/21 是跨体系相邻造成的假阳性**。
#      本版新增 group_by，按令牌角色前缀**分组**后只在组内算阶比；无令牌命名时
#      降级为整体序列并在 detail 显式标注（不假装分过组）。
#   B. 收窄 G7 的 applies_to：[ui, ppt] → [ppt]。依据是其 source 讲的是**投影阅读距离**
#      （「经典模数 1.25 在投影上看不清」），对屏幕场景不成立。
#   C. G3/G4/G5 的 source 改引**可外部复核的契约原文**（WCAG 2.1 + ui 库
#      schema.json#contrast），阈值一字未改。G4 补注说明它与 fg-muted 的区别。
#   D. G1/G6 补 note，显式声明它们计量的是「**单页画面内**」的量，并指向 token 层的对应判据。
#   E. 新增 5 条判据：G11 调色板可辨识性 / G12 字号刻度一致性 / G13 时长刻度一致性 /
#      G14 中等次要文字对比度 / G15 强调色可用性。其中 G14 补的是**真实覆盖缺口**
#      （契约里 fg-muted 门槛 4.5，v1.0 无判据）。
#   F. 新增 override 用法（v1.0 表头承诺但无实现，属悬空承诺 —— 本版落地）。
#
# ⭐ v1.2（2026-09-26）变更摘要 —— **首次在「真实 deck 渲染页」上实测**后回头改判据
#   起因：v1.1 的 R 组只在自造夹具页上跑过。把 ui库 dist-demo 真实渲染页（真 Chrome+CDP）
#   的几何喂进来后，G1/G6/R1/R2/R3 **全 FAIL**；逐条取证发现**都不是产物的毛病，
#   而是判据文本与实现不一致**（本文件第 8-9 条原则「applies_to 必须与 source 语义一致」
#   被自己的实现违反了）：
#   G. G1/G6 的**输入**改为渲染结果（`--geom`）：本条 note 早就写明「token 表不适用」，
#      实现却拿令牌清单顶「画面内」口径 ⇒ 21 套主题 21/21 假 FAIL。缺渲染色判 SKIP。
#   H. R1 修 `_flush_miss` 的 `int()` 簇心截断（凭空造出 ≤1px 假差，实测 10 处），
#      并新增**噪声地板** `noise_px: 0.5`（亚像素差眼睛看不出，而规则要的是 the eye notices）。
#   I. R2 改为先判「**并排同行**」再比高度（原按 parent 分组会把竖排的标题/副标题当一行，
#      实测报出「高 528%」）；无可比并排行 ⇒ SKIP，不是 PASS。
#   J. R3 **必须声明韵律网格**（去掉默认 8px）：ui库 schema.json#spacing 明确「不强行归并」，
#      该设计系统根本没有 baseline 网格，硬套 8px 是判据凭空发明契约。
#   K. R1/R2 的**空节点集**不再判 PASS（没数据不得冒充没问题）。
#   ⚠️ 本轮**没有**为了让 FAIL 消失而放宽容差/删判据：G1/G6 换成真实渲染输入后照样能 FAIL；
#      R1 的 1.2px 真错位、R2 的 30% 真漂移、R3 声明网格后的 4px 离格，全部仍判 FAIL（均有对照）。
#
# ⭐ v1.3（2026-09-27）变更摘要 —— 「请闭环」四项待拍板的落地：**一处阈值都没动**
#   起因：v1.2 跑完 21 套真实 deck 页后仍留 49 处 FAIL（G6 21 / G7 21 / G11 7）。
#   逐条追证据后：**49 处全部是判据自己的口径问题，产物排版是对的**。
#   L. G6 把**容器继承的字号**当成了「层级」（假 FAIL 的第二真因）。真实封面
#      `.ui-deck__slide` 根容器继承 14px、装饰 span 继承 26px，**都没有一个字**，
#      却把真值 4 档抬成 6 档 ⇒ 改为**只统计承载文字的节点**。max 仍 4。
#   M. G7 把**引号字形**并进了引文的刻度（假 FAIL 的第二真因）。原按「第一段词」分组，
#      于是 `size-quote`(42px) 与 `size-quote-mark`(150px，自带 font/weight/leading/
#      tracking/color 五个独立令牌) 同组，阶比 3.571 ⇒ 改为按**完整角色段**分组。
#   N. G11 把**层级底色**当成了「该合并的重复色」（7 套假 FAIL 的真因）。7 处**全部**是
#      bg ↔ bg-alt ↔ card-bg（ΔE00 0.61–1.96），**无一涉及 accent/fg** ⇒ 作用域**收窄到语义色**，
#      被排除的令牌**逐条打印**（可审计）。新增可选 `params.layer_name_re`。
#   O. **G4/G5 决定不动**（保持 3.0）：WCAG 2.1 AA 为现行有效标准，WCAG 3 未定稿、
#      APCA 未成为标准。此条写明理由，避免下一轮又被当成"待办"重复提出。
#   ⚠️ 三条修复**一条阈值都没改**（max:4 / [1.2,1.8] / ΔE00 2.0 / 3.0 全部原样），
#      改的只是「这条判据该吃哪个输入」；每条都配**阴性对照**证明判据仍有牙齿。
#
# ⭐ v1.4（2026-09-27）变更摘要 —— G12/G13/R3 的**可达性审计**（**一条阈值都没动**）
#   起因：v1.3 收尾留下「G12/G13/R3 在真实产物上仍是 no-op」。本版做的是**判定可达性**，
#   而**不是**「想办法让它们跑起来」——「跑起来」有两条路，其中一条会**制造绿灯**：
#   P. G12/G13 **自证式刻度护栏**。实测取证：ui库 21 套主题的生成 CSS 里 raw `font-size:`
#      数 = **0**，`sizes` 与 `--deck-size-*` 令牌集**逐值相同**（时长同理）。若把
#      「产物自己的令牌集」填进 `params.scale`，则 `被检值 ⊆ 刻度` **恒成立** ⇒ 恒 PASS。
#      那不是启用，是**制造绿灯**（比 no-op 更坏，no-op 至少诚实报「未检测」）。
#      ⇒ 检出「刻度集 ≡ 被检 CSS 自身导出的刻度集」即判 SKIP；正确形态是**两侧分离**。
#   Q. G13 的 **0ms 不参与判定**：`animation-delay: 0s` 被 DUR_RE 收进 durations 后
#      被当成「不在刻度内」。0 是「无延迟」，**不是刻度上的一档**；排除数量在 detail 显式报出。
#      ⚠️ 与 P 不同，这条**不是放宽**：非 0 的离格值照样 FAIL（有阴性对照）。
#   R. R3 **三种 SKIP 分开措辞**：缺渲染色（未检测）／未声明网格（**结构性不适用**）／
#      有网格才真判。ui库 未声明任何 baseline 网格 ⇒ 该 SKIP 是**正确终态**，不是待办。
#   S. G12/G13 的**正确启用形态**写入 note：声明侧（独立规范/令牌文件）与被检侧（使用侧
#      CSS：布局/组件层会有不出现在令牌里的硬编码值）必须**分离**，不得同源。
#   ⚠️ 阈值原样：`tolerance_px 0.5` / `tolerance_ms 1.0` / 无默认 `baseline_px`。
#
# ⭐ v1.5（2026-09-27）变更摘要 —— **delay/stagger 与 duration 分家 + `--scale-from` 挂进常规跑批**
#   （**一条阈值都没动**：`tolerance_px 0.5` / `tolerance_ms 1.0` 原样）
#   T. ⚠️ **复测推翻了 v1.4 的一句读数**：v1.4 写「G13 离格值集合恰好 `[200.0]`」——
#      该句是从 detail **字符串反解**的（`split("：")[1].split("（")[0]`），而 detail 只打印
#      `off[:6]`，于是「前 6 个」被读成了「全部」。按「**上一轮的结论 = 待复测假设**」重测：
#      真实离格值 **6 个**（`180 / 200 / 300 / 440 / 600 / 780` ms）。
#      ⇒ **读数必须由原始数据统计，不得从被截断的展示字符串反解。**
#   U. **取数口径：`delay` 不是 `duration`**。原实现按**行**扫 `(animation|transition)`，
#      于是 `animation-delay: 0.08s` 这类**错峰阶梯**也被当成「时长」（ui库 `Deck.css`
#      L386-393 一整条 stagger 序列因此被判离格）。而本判据的契约是「**时长**是否来自
#      同一刻度」——delay 是「推迟多久开始」，与「持续多久」量纲不同。
#      改为**按声明级**解析；`*-delay` 归 delay 门，简写 `transition`/`animation` 取
#      **首个**时间值为 duration、第二个为 delay；被排除值**登记并报出**（不静默）。
#   V. **令牌层同病**：原 `TOK_DUR_RE` 把 `duration|delay|stagger` 一锅端。实测 21 套主题
#      **各有一条** `--deck-motion-stagger`，与 `Deck.css` 的 delay 阶梯**同值同源** ⇒
#      声明侧与被检侧同源，该维度上 `被检值 ⊆ 刻度` **恒真**。这是**「假绿」的第二形态**
#      （第一形态见 v1.4 的 P：用产物自身的令牌集当刻度）。⇒ 刻度集只吃 `--*duration*`。
#      ⚠️ **韵律层（错峰序列）当前判据集未覆盖** —— 如实记为未覆盖，不假装覆盖。
#   W. **`--scale-from`（启用通道）**：此前门禁调校验器不带 scale ⇒ G12/G13 在常规跑批里
#      **永远 SKIP**（= 挂不上去）。新增 `--scale-from <声明源 .css>`：从**令牌声明**取刻度
#      并集作为 G12/G13 的默认刻度；**显式 `--override` 优先**；**同源剔除并报出**；
#      剔除后为空 ⇒ **不合成** override（保持 SKIP），绝不因启用开关而变恒真 PASS。
#      门禁侧用 `meta.审美判据.声明刻度源` 登记（项级优先于块级），并新增**刻度层暴露率注记**
#      （与渲染层注记同构：0 个登记 ⇒ 明说「未检测，不是通过」）。
#   X. 修产物（**属产物侧决策，本轮唯一的产品改动**）：`Deck.css` L105 `width 200ms` →
#      `var(--ui-duration-normal, 220ms)`；L124 `opacity 180ms` → `var(--ui-duration-fast, 140ms)`。
#      修后 G13 对 `Deck.css` **PASS**；修前它精确指认的正是这两行。
#
# ⭐ v1.6（2026-09-27）变更摘要 —— **补韵律层判据 + 两处既存 FAIL 定性**（**一条阈值都没动**）
#   Y. 新增 **G16 错峰阶梯非递减**（`rhythm_ladder`）—— 补 v1.5 第 V 条自认的覆盖缺口。
#      ⭐ 它是**结构性不变量**，**不引入任何数值阈值**：错峰的意义是「越靠后的元素越晚入场」，
#      阶梯回退就意味着后面的元素反而先动。两侧输入 = 声明侧 `--*stagger*`/`--*delay*`
#      令牌序列 ＋ 应用侧 `nth-child` 序列（**带索引取** —— 取成集合就丢了顺序，而顺序才是其语义）。
#      ⚠️ **刻意不要求步长均匀**：真实语料是**加速步长** 80/100/120/140/160/180ms，
#      要求等步长会把它判成缺陷 —— 那才是「凭空发明契约」（同 R3 默认 8px 的教训）。
#      允许**末尾饱和封顶**（`nth-child(n+8)` 复用末值）⇒ 判「非递减」而非「严格递增」。
#      无 ≥`min_points` 点序列 ⇒ **SKIP**（无对象，不是通过）。
#   Z. 修 **M1 的「空集冒充问题」**（真缺陷）：原实现下「该文件根本没有动效」与「有动效但
#      没写秒数」**输出完全相同**（都 FAIL）。实测 `layouts.css` 零动效声明（`transition`
#      / `animation` / `*duration` 一个都没有）却被判 FAIL ⇒ **判据在造信号**。
#      现两态分开：无动效声明 ⇒ **SKIP（无对象）**；有声明却无时长 ⇒ **FAIL**。
#      `transition: none` 属**显式无动效**，不计入（该文件有 4 处，否则会造出假 FAIL）。
#   AA. 修 **W2 的悬空参数**（真缺陷）：`params.allowed_in_layers` 自 v1.0 声明至今
#      **一个字符都没被读** ⇒ 判据比文档更严（文档说氛围层可用，实现是「任何 radial 即 FAIL」）。
#      现按块内**显式声明** `--ui-layer: <层名>` 放行；**缺声明一律 FAIL（fail-closed）** ——
#      CSS 没有可机器识别的「层」概念，默认放行会让本判据退化成 no-op（同 R3 的
#      `baseline_px` 处置：**要声明，不猜**）。
#   BB. 产物改动（经用户指令授权）：`Deck.css` L55 `opacity 220ms` / L146 `background 140ms`
#      两处剩余硬编码时长改走 `--ui-duration-*` 令牌。
#   CC. ⚠️ **新发现（登记，不在本轮范围）**：用 AST 探针（`tmp/v160/audit_params.py`）查出
#      还有 **7 个检查器完全不读 `params`** —— 它们声明的参数同样是**悬空承诺**（与 W2 同族，
#      即「文档写着有、代码里没有」）：`chk_accent_unique`(G2/expected) ·
#      `chk_memory_point_count`(G8·V2/expected,field) · `chk_primary_cta_count`(G9/expected) ·
#      `chk_motion_minimal_set`(M3/elements) · `chk_interactive_feedback_coverage`(W1/coverage) ·
#      `chk_shot_spec_present`(V1/elements) · `chk_series_count_max`(C1/max)。
#      它们都是 **spec 族的存在性检查**（判 `has_*` 布尔，不计数），把 `expected`/`max`/`elements`
#      真正落地需要先定义 spec 的计数口径（属设计决策）⇒ **本轮只登记、不擅自实现**。
#      M1 的 `coverage` 同属一族，因本轮正在改 M1，已一并接上。
#
# ⭐ v1.7（2026-10-07）变更摘要 —— 新增渲染层判据 R4（几何重叠）（**既有 30 条一字未改**）
#   DD. 新增 **R4 文本被后绘制的实心元素遮挡**（`geometry_occlusion`）—— 来源是
#       `cathrynlavery/diagram-design@d1376371965f513d99cc9ec388835d255c5c88d5` 的设计纪律
#       「文本/遮罩层不被其后绘制的实心元素覆盖」（图示设计模式 §6 F5）。它是渲染层 **R 组
#       缺的那一类空白项**（R1 对齐 / R2 尺寸 / R3 韵律，都不管「谁盖住了谁」）。
#   EE. ⚠️ **本条落地必须先扩取数契约**：要判「被其后绘制的实心元素覆盖」得知道
#       「**不透明度**」与「**绘制先后**」两个量，而原 geom 契约的 `bg` 把 alpha 丢了、
#       也没有序。⇒ `geom-probe.js` **向后兼容地**新增 `bgAlpha`（无背景/解析不出写 null）；
#       校验器**缺该字段或未喂 `--geom` 一律判 SKIP（不是 PASS）**。否则本条将永远 SKIP
#       = **死代码**（「声称有、实际到不了」，本仓最忌）。
#   FF. ⚠️ **绘制先后用文档序 `i` 近似层叠序，不解析 `z-index`** ⇒ 靠定位/层叠上下文改变
#       绘制序的版面**不在射程内**；且本判据报出的是**几何事实**（有实心元素覆盖文本），
#       **是否刻意遮挡（模态框等）由人审判断** —— 见本条 note 的诚实边界。
#   ⚠️ 阈值来源：`opaque_alpha 0.95` / `cover_ratio 0.8` 是本仓给的**默认档**（`source`
#      字段如实写「本仓默认，可任务级覆盖」），**不是**从 diagram-design 搬来的数值 ——
#      对方的设计系统（纸色/珊瑚色/字体）与几何无关，本条**只搬规则**。
