version: "1.7"
updated: "2026-10-07"

judgeability:
  machine: "从产物直接量出，校验器自动判定"
  spec: "从 spec 文档解析声明值，校验器半自动判定"
  manual: "机器无法判定，登记为人审点"
  external: "由外部工具判定，本校验器不重复实现"

# ============ 产物级覆盖（override）============
# 判据集提供**默认阈值**。具体产物若确有理由偏离默认，可在 plan 的
# meta.审美判据.覆盖 里逐条覆盖 —— 覆盖是「有理由的例外」，不是「换个数字」。
#
#   覆盖:
#     - id: G7
#       applies_to: [ppt]                # 覆盖适用范围（整键替换）
#       params: { min: 1.15 }            # 覆盖参数（**浅合并**，未提到的键保留默认）
#       reason: "本产物为投影演示；下限按 M3 实测最低阶比 1.091 放宽"
#
# 规则（三条，与检查项 22 的判定一一对应）
#   1. 覆盖条目必须写 reason；空、占位（待定/无/TBD/N/A/？）一律 FAIL
#   2. 覆盖了、但当次运行**未产生任何影响**（该判据没 FAIL、或根本没参与判定）⇒ WARN
#      —— 闲置的覆盖会从「有理由的例外」退化成橡皮图章
#   3. 覆盖不得引入未知键（判据本身没有的 params 键、未知的 applies_to 取值）⇒ audit FAIL
#   4. 覆盖**只改参数与适用范围，不改判定语义** —— 不得用它把 FAIL 洗成 PASS

# ============ 通用层 G：所有视觉产物 ============
criteria:

  - id: G1
    dimension: "色彩纪律"
    name: "画面内颜色数量上限"
    judgeability: machine
    check: color_count_max
    params: { max: 6 }
    source: "ppt-dissect-and-retheme.md §三-B（画面内总共只有 8 个 srgb 值）/ 视频拆解 §5.4-1（颜色收敛到「背景 + 1 个强调色」）"
    applies_to: [ui, ppt, chart, image]
    note: "本判据计量的是**单页画面内**的去重色值数。source 原文记 8、params 有意取 6（更严，收敛优先）—— 这是刻意的收紧，不是笔误。token 表的调色板规模**不适用**本判据（见 G11）。⚠️ v1.2.2：**输入必须是渲染结果**（`--geom` 产出的画面色值）—— 此前实现拿 CSS 令牌清单去顶「画面内」口径，21 套主题 21/21 假 FAIL；现缺渲染色即判 SKIP（未检测），有渲染色则数画面里真实出现过的颜色。"

  - id: G2
    dimension: "色彩纪律"
    name: "强调色唯一"
    judgeability: spec
    check: accent_unique
    params: { expected: 1 }
    source: "视频拆解 §5.4-1（「只用 X，颜色留给 Y」的减法句式）"
    applies_to: [ui, ppt, chart, image]

  - id: G3
    dimension: "可读性"
    name: "正文对比度"
    judgeability: machine
    check: contrast_min
    params: { role: body, min: 4.5 }
    source: "WCAG 2.1 AA 正常文字 4.5:1；ui 库 schema.json#contrast.thresholds.fg = 4.5（与 verify-deck-themes.py 的 THRESHOLDS 为两处独立实现，取值一致）"
    applies_to: [ui, ppt, chart]

  - id: G4
    dimension: "可读性"
    name: "次要文字对比度"
    judgeability: machine
    check: contrast_min
    params: { role: subtle, min: 3.0 }
    source: "ui 库 schema.json#contrast.rule 原话：fg/fg-muted 按正文标准 4.5:1；fg-subtle 与 accent-strong 按大字/图形标准 3.0:1（WCAG 2.1 原文，不做四舍五入，4.499 即不合格）"
    applies_to: [ui, ppt, chart]
    note: "本判据只管 fg-subtle 档 —— 它在契约里按「大字/图形」标准取 3.0。中间档 fg-muted 的门槛是 4.5，见 G14。两档不可混用，命名相近但不等价。⚠️ **2026-09-27 决定：阈值不动（保持 3.0）** —— 3.0 出自 WCAG 2.1 AA，是**现行有效**标准；WCAG 3 尚未定稿、APCA 也未成为标准，没有可依据的新阈值。此条已决策，下一轮不再作为待办重复提出。"

  - id: G5
    dimension: "可读性"
    name: "强调色承载对比度"
    judgeability: machine
    check: contrast_min
    params: { role: accent, min: 3.0 }
    source: "ui 库 schema.json#contrast.thresholds.accent-strong = 3.0（大字/图形标准）；同文件 accentPolicy 规定：accent 本身原色保留、承载文字必须改用 accent-strong"
    applies_to: [ui, ppt]
    note: "取的是 accent-strong 槽位（不是 accent）。accent 是否可用作文字色另见 G15。⚠️ **2026-09-27 决定：阈值不动（保持 3.0）** —— 同 G4：WCAG 2.1 AA 现行有效，WCAG 3 / APCA 未成标准。此条已决策，不再重复提出。"

  - id: G6
    dimension: "层级"
    name: "画面内字号层级数上限"
    judgeability: machine
    check: font_scale_count_max
    params: { max: 4 }
    source: "视频拆解（H1 / H2 / Body 三级）/ ppt-dissect-and-retheme.md §二-4（大阶比的代价是需要更少的层级数）"
    applies_to: [ui, ppt, chart]
    note: "本判据计量的是**单页画面内**出现的层级数（源明确为 H1/H2/Body 三级）。token 表的档位数**不是**本判据的对象 —— 业界实测 M3 为 11 档、Tailwind v4 为 13 档，若拿 max:4 去量 token 表必然全 FAIL，那是口径错配。token 层请用 G12。⚠️ v1.2.2：**输入必须是渲染结果**（`--geom` 产出的实际字号档数）—— 与 G1 同批修正（此前同样误拿令牌清单顶口径）；缺渲染色即判 SKIP（未检测）。⚠️ v1.3：**只统计承载文字（text 非空）的节点** —— 吃渲染结果之后又数多了：原实现取 fontSize 非空的**全部可见节点**，于是把「**容器继承的字号**」也当成一个层级。真实 deck 封面上 `.ui-deck__slide` 根容器继承 14px、装饰 span 继承 26px，二者**都没有一个字**，却把真值 4 档抬成 6 档（21 套主题**无例外**地回到 4 档）。max 仍是 4 —— 页面若真用 5 档**文字**字号，照样 FAIL（有阴性对照）。取数器未提供 text 字段时退回全部节点并在 detail 显式标注，不静默改口径。"

  - id: G7
    dimension: "层级"
    name: "同体系字号阶比区间"
    judgeability: machine
    check: font_scale_ratio_range
    params: { min: 1.2, max: 1.8, group_by: role-prefix, min_group_size: 2 }
    source: "ppt-dissect-and-retheme.md §二-4（×1.6 是值得记住的选择：经典模数 1.25 在投影上看不清）—— 依据是**投影阅读距离**，故只适用于 ppt"
    applies_to: [ppt]
    note: "v1.1 修复两处：① 算法 —— v1.0 把 caption/body/h/display 的全部字号混在一个序列里排序算相邻阶比，而不同体系之间本无可比性，实测 21 套主题全 FAIL、其中 15 套是假阳性；本版按令牌角色前缀分组，只在组内算阶比。② 范围 —— applies_to 收窄为 ppt（source 讲的是投影可读性）。无令牌命名时降级为整体序列，并在 detail 里标注「未分组」。⚠️ v1.3 **分组修正（第三处假 FAIL 的真因）**：原按「**第一段词**」取词根 ⇒ 凡「同词根 + 不同角色后缀」的令牌都被并进一组。实测：`--deck-size-quote`（42px，引文正文）与 `--deck-size-quote-mark`（150px，**引号字形** —— 它自带 font / weight / leading / tracking / color 五个独立令牌，在 `ui库/deck/layouts/layouts.css` 里是独立角色）被并成 `quote` 组，组内阶比 150/42 = 3.571 ⇒ **21 套主题 21/21** 报越界。现按**完整角色段**分组（`quote` / `quote-mark` 分家）；尺寸修饰词（sm/lg/2xl…）与数字仍被剥离，故 `body` + `body-sm`、`h2` + `h3` 仍同组。单成员体系按 min_group_size 自动 no-op（no-op ≠ 通过）。区间 [1.2, 1.8] **一字未改**。"

  - id: G8
    dimension: "焦点"
    name: "记忆点唯一"
    judgeability: spec
    check: memory_point_count
    params: { expected: 1 }
    source: "视频拆解 §5.4-4（记忆点只能有一个）/ 成品网页拆解 §6.5（记忆点要落到结构而非特效）"
    applies_to: [ui, ppt, image]

  - id: G9
    dimension: "焦点"
    name: "主操作唯一"
    judgeability: spec
    check: primary_cta_count
    params: { expected: 1 }
    source: "视频拆解 §5.4-2（主按钮超过一个，视觉重心就散了）"
    applies_to: [ui]

  - id: G10
    dimension: "统一性"
    name: "贯穿元素的复用"
    judgeability: manual
    check: null
    params: { min_reuse: 3 }
    source: "ppt-dissect-and-retheme.md §二-6（4 KB 印章出现在 13 页上——统一性来自复用）"
    applies_to: [ui, ppt]
    note: "人审点：检查是否存在一个元素贯穿全套（水印/落款/装饰母题）。注：同族缺陷「近乎对齐」已被证明可机器判定（plumb edge/near-alignment），但需渲染后的几何信息，见 R1/R2/R3。"

# ---- v1.1 新增：token 层一致性（形态取自 plumb 的 *-conformance 家族）----

  - id: G11
    dimension: "色彩纪律"
    name: "调色板可辨识性"
    judgeability: machine
    check: palette_separation
    params: { min_separation_de: 2.0 }
    source: "plumb color/palette-conformance 的 CIEDE2000 ΔE00 容差 2.0 —— 原义是「离最近 token 的距离不得超过 2.0」；本判据反向使用同一常数：**两个不同色值的距离若小于 2.0，人眼已无法区分，就该合并**"
    applies_to: [ui, ppt, chart, image]
    note: "本判据不需要外部白名单（纯自证）。plumb 的原义需要 color.tokens 白名单，本库的令牌 CSS 里「声明」与「使用」是同一集合，无法照搬 —— 这里做的是同源改造，不是原样移植。⚠️ v1.3 **作用域收窄到「语义色」**：层级/表面色（bg / bg-alt / card-bg / surface / paper / overlay …）是**同一语义下的明度阶梯**，其微差正是「分层」这一设计意图本身，不该按「不可辨即合并」去判。实测取证：21 套主题里 7 套 FAIL **全部**是 bg ↔ bg-alt ↔ card-bg（ΔE00 0.61–1.96），**无一涉及 accent / fg** —— 属作用域错配（同 G1/G6 一族）。被排除的令牌**逐条打印在 detail 里**（可审计、不静默）；需要改模式时用 override 提供 layer_name_re（正则字符串）。"

  - id: G12
    dimension: "层级"
    name: "字号刻度一致性"
    judgeability: machine
    check: scale_conformance
    params: { kind: font-size, tolerance_px: 0.5, scale: [] }
    source: "plumb type/scale-conformance（font-size 必须落在 type.scale，容差 0.5px 以容纳 getComputedStyle 的次像素舍入）；声明集缺失时规则 **no-op** 而非判全部违规（同文件原话：rather than flagging every value as out-of-scale）"
    applies_to: [ui, ppt, chart]
    note: "刻度集（params.scale）默认空 ⇒ 本判据判 SKIP 并说明「未声明刻度集」。要启用，请用 override 提供 scale，或在产物侧声明。空声明集**不是**通过。⚠️ v1.4 **正确启用形态（务必两侧分离）**：① **声明侧** = 独立的规范/令牌文件（不得是被检的那份 CSS）；② **被检侧** = **使用侧** CSS —— 布局层与组件层会出现**不出现在令牌里**的硬编码值（实测 ui库 `Deck.css` 有 13px/14px、`layouts.css` 有 34px）。⚠️ **自证式刻度护栏**：实测 21 套主题生成 CSS 的 raw `font-size:` 数 = 0，`sizes` 与 `--deck-size-*` 令牌集逐值相同 ⇒ 若用「产物自身的令牌集」当 scale，`被检值 ⊆ 刻度` **恒成立**、判据退化为**恒 PASS**。检出即判 **SKIP**（理由「刻度集与被检值同源 ⇒ 恒真，不算通过」）。⚠️ v1.4 起取数层另修一处：`em` 是上下文相关的相对单位，**不折成像素**（原实现 `1em`→16px、`0.94em`→15.04px，实测在 `layouts.css` 上凭空造出 4 个「离格字号」），改为登记进 `unresolved_sizes` 并在 detail 报出。⚠️ v1.4 **声明侧还必须是「同一体系」**：实测教训 —— 第一版实验只拿 deck 主题的排版刻度去量 `Deck.css`（组件壳），13/14px 与 140/220ms 全被判离格（**37/42 假 FAIL**）；追下去发现它们**在 ui kit 自己的刻度上**（`src/styles/tokens.css`：`--ui-font-size-sm/md` = 13/14px、`--ui-duration-fast/normal` = 140/220ms）。⇒ 一个文件混用多套体系时，刻度集应取**该产物已声明刻度的并集**（实测：ui kit 7 档 ∪ deck 主题 10–12 档 ⇒ G12 **42/42 PASS**）。否则就是 G1/G6/G11 一族的**作用域错配**再次上演。⚠️ v1.5 **启用通道**：`--scale-from <声明源 .css>`（可重复，逗号分隔亦可）—— 门禁侧登记 `meta.审美判据.声明刻度源`（项级优先于块级）后，检查项 22 自动透传，G12 才在**常规跑批**里真跑；**未登记**由「刻度层注记」明说「未检测，不是通过」（与渲染层注记同构）。同源声明源被剔除并报出；剔除后为空即保持 SKIP，**不合成** override。"

  - id: G13
    dimension: "动效完备性"
    name: "时长刻度一致性"
    judgeability: machine
    check: duration_scale_conformance
    params: { tolerance_ms: 1.0, scale: [] }
    source: "plumb 的 *-scale-conformance 家族（radius/shadow/opacity/z-index 同构）；Tailwind v4 默认 --default-transition-duration: 150ms —— 时长应来自声明的刻度集，而非每处随手写"
    applies_to: [ui, ppt]
    note: "与 M1 的分工：M1 管「有没有写时长」（完备性），本判据管「时长是否来自同一刻度」（一致性）。刻度集默认空 ⇒ SKIP。⚠️ v1.4 两处收紧（同 G12 一族）：① **自证式刻度护栏** —— 刻度集不得由被检 CSS 自身的时长令牌导出（21 套主题的 durations 与 `--deck-motion-*` 令牌**逐值相同**，用它当 scale 则恒真）；② **0ms 不参与判定** —— 实测 `animation-delay: 0s` 被收进 durations 后遭误报：「无延迟」不是刻度上的一档，其数量在 detail 显式报出。⚠️ 阈值 `tolerance_ms 1.0` 原样，非 0 离格值照样 FAIL。⚠️ v1.4 **首次真实读数**（21 主题 × Deck.css / layouts.css，声明侧=ui kit `--ui-duration-*` ∪ 主题 `--deck-motion-*`）：layouts.css 无时长 ⇒ SKIP 21/21；Deck.css 判 FAIL。⚠️ **v1.5 复测修正**：v1.4 此处原文写「离格值集合恰好是 `[200.0]`」，**不准确** —— 那是从被截断的 detail 字符串（只打印 `off[:6]`）反解出来的，把「前 6 个之一」读成了「全部」；真实离格值是 **6 个**（`180 / 200 / 300 / 440 / 600 / 780` ms）。⚠️ v1.5 另修**取数口径**：`delay` 不是 `duration` —— `*-delay` 与简写 `transition`/`animation` 的**第二个**时间值归 delay 门（登记进 `delay_excluded` 并在 detail 报出，不静默），`--*stagger*` 令牌同理不进刻度集（否则与被检侧 delay 阶梯**同源** ⇒ `被检值 ⊆ 刻度` 恒真，是「假绿」的第二形态）。分家后 G13 精确指认 `Deck.css` 的**两行**：`transition: width 200ms`（L105）与 `transition: opacity 180ms`（L124）。⚠️ v1.5 **启用通道**：`--scale-from <声明源 .css>`（可重复，逗号分隔亦可）／门禁侧登记 `meta.审美判据.声明刻度源`（项级优先于块级）——此前门禁不带 scale，本判据在常规跑批里**永远 SKIP**；同源声明源会被剔除并报出，剔除后为空则保持 SKIP（不合成 override）。⚠️ **韵律层（错峰序列）当前判据集未覆盖**，如实记为未覆盖。修产物后（两行改走 ui kit 的 `--ui-duration-*` 令牌）G13 对 `Deck.css` **PASS**。"

  - id: G14
    dimension: "可读性"
    name: "中等次要文字对比度"
    judgeability: machine
    check: contrast_min
    params: { role: muted, min: 4.5 }
    source: "ui 库 schema.json#contrast.thresholds.fg-muted = 4.5（按正文标准）；该值与 verify-deck-themes.py:THRESHOLDS 独立实现一致"
    applies_to: [ui, ppt, chart]
    note: "补 v1.0 的**真实覆盖缺口**：契约里文字色共四档（fg / fg-muted / fg-subtle / accent-strong），v1.0 只覆盖了其中三档，漏掉 fg-muted。门槛 4.5 比 G4 的 subtle 更严，二者不可互相替代。"

  - id: G15
    dimension: "色彩纪律"
    name: "强调色可用性"
    judgeability: machine
    check: accent_availability
    params: { min_ratio: 3.0 }
    source: "ui 库 schema.json#contrast.accentPolicy：accent 本身不做对比度修正、原色原样保留（实测 biennale-yellow 的 accent=sun #F1EE2E 在米色纸上对比度仅 1.02，但它是「黄块 + 深蓝字」的色块色，提亮到 3.1 会得到暗黄/橄榄色、等于毁掉原设计）；同时规定 accent 对 bg 低于 3:1 的模板在报告中记为 **NOTE（非 WARN）**"
    applies_to: [ui, ppt]
    note: "本判据**不判 FAIL**：accent 低于 3:1 是合法设计，只是不可直接用作文字色。低于阈值记 PASS 并在 detail 前置 NOTE 前缀（保留三态，不新增第四态）。"

  - id: G16
    dimension: "动效节奏"
    name: "错峰阶梯非递减"
    judgeability: machine
    check: rhythm_ladder
    params: { min_points: 2 }
    source: "结构性不变量（**不是阈值**）：错峰序列须单调不回退 —— 越靠后的元素越晚入场；阶梯回退意味着后面的元素反而先动，与「错峰」这一设计意图直接矛盾"
    applies_to: [ui, ppt]
    note: "补 v1.5 自认的覆盖缺口（v1.5 的 G13 note 写着「韵律层（错峰序列）当前判据集未覆盖」）。两侧输入：① **声明侧** = `--*stagger*`/`--*delay*` 令牌的斜杠序列（实测 21 套主题各一条 `--deck-motion-stagger`）；② **应用侧** = 同一选择器前缀下按 `nth-child` 索引排序的 `animation-delay` 序列（实测 ui库 `Deck.css` L386-393）。⭐ **刻意不要求步长均匀** —— 真实语料是**加速步长** 80/100/120/140/160/180ms，要求等步长会把合规产物判成缺陷（「凭空发明契约」，同 R3 默认 8px 的教训）。允许**末尾饱和封顶**（`nth-child(n+8)` 复用末值 0.78s，防止无限推迟）⇒ 判「**非递减**」而非「严格递增」。⚠️ 本判据**无阈值可调**：`min_points` 只决定「几点才算一条序列」，不改变判定方向。无 ≥`min_points` 点的序列 ⇒ **SKIP**（本判据无对象，不是通过）。"

# ============ 动效层 M：含动态的产物 ============
  - id: M1
    dimension: "动效完备性"
    name: "时间刻度必填"
    judgeability: machine
    check: motion_has_duration
    params: { coverage: 1.0 }
    source: "视频拆解 §5.1 元规律 3（时间刻度是动效的灵魂；没写秒数 AI 一定会自己猜）"
    applies_to: [ui, ppt]
    note: "⚠️ v1.6 **三态分开**（原实现把「该文件根本没有动效」与「有动效却没写秒数」**判成一样**，属**判据造信号** —— 实测 `layouts.css` 零动效声明却被判 FAIL）：① 有动效声明但缺时长 ⇒ FAIL；② 有动效声明且都带时长 ⇒ PASS；③ 无动效声明但声明了**时长令牌** ⇒ PASS（纯令牌产物如 21 套主题：秒数确实写下来了 —— 早期版本这一态靠 `durations` 非空蒙对，属**作用域错配**，同 G1/G6/G11 一族）；④ 既无动效声明、也无时长令牌 ⇒ **SKIP（无对象，不是通过）**。`transition: none` / `none !important` 属**显式**无动效，一律不计入。⚠️ `coverage` 此前**只声明未消费**（与 W2 的 `allowed_in_layers` 同族的悬空参数，由 AST 探针 `tmp/v160/audit_params.py` 查出），v1.6 起真正生效（默认 1.0 ⇒ 与旧行为一致）。"

  - id: M2
