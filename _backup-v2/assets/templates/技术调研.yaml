# 技术调研类任务确认表模板（沉淀自 2026-09-10 模型路由与工作流编排调研）
task_type: 技术调研
confirmed_at: 2026-09-10
goal: "围绕给定主题完成产业格局 + 技术路线 + 开源项目对比 + 落地建议四维调研"
inputs:
  - "用户给定调研主题与侧重方向"
  - "WebSearch + GitHub API 开源查重"
deliverable:
  format: "Markdown"
  path: "当前工作区根目录或 tasks/技术调研-<YYYY-MM-DD>/"
  naming: "调研-<主题>-<YYYY-MM-DD>.md"
  length: "4000-6000 字（统计口径：汉字+英文单词+数字，即 Word 字数口径）"
  note: "调研任务查重=检索既有报告/横评避免重复劳动，GitHub API 仅作数据源实测，不作为查重对象"
acceptance:
  - "关键论断附来源链接（来源可溯）"
  - "含项目对比矩阵表"
  - "结论部分给出明确判断与落地建议"
  - "结论标注证据等级，厂商案例与营销倍数不作为证据"
constraints:
  - "不产出 Office 文档"
  - "引用标明 URL"
  - "先查重后写稿"
  - "检索方向 ≥3 个时并行派发子代理，不串行等待"
research:
  - item: "模型路由 / 网关 / 工作流编排产业格局"
    decision: "已完成 2026-09-10；结论：价值从模型层上移到聚合路由 + 网关治理 + 编排控制面三层"
    date: "2026-09-10"
flow: "分层判定 → 查模板 → 1 轮追问确认 → 并行检索 + GitHub 实测 → 报告 → Anti-drop 自检 → 交付 → 复盘沉淀"
