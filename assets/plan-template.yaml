# 执行计划模板（阶段 3 落盘为 tasks/<任务类型>-<日期>/plan.yaml）
# 键名统一为中文，与 SKILL.md 阶段 3 第 1 条一致。
# status 取值: 待办 / 进行中 / 完成 / 受阻 / 熔断
#   「熔断」= 本步已停止自动化、等待用户决策（见 SKILL.md「熔断机制」）。
#   一旦出现该状态，或下方「熔断状态: 已熔断」，checks.py plan 将直接判 FAIL，
#   并要求同目录存在《熔断报告.md》（含 触发条件/已试路径/卡点根因/待决策选项/复位条件）。
# 交付物: 【必填】该步骤的实际产出文件路径或明确结论位置（阶段 5 Anti-drop 对账完全依赖此字段）
#   ⚠️ 相对路径**只**以 --base=<工作区根> 为基准解析；工作区根之外的文件必须写绝对路径。
meta:
  任务: ""              # 与任务确认表的目标一致
  工作区根: ""          # 【必填】本次任务工作区绝对路径；读写与产出默认限此目录内，越界需用户当次授权
  创建时间: ""          # YYYY-MM-DD HH:mm
  任务层级: ""          # L1 / L2
  确认表: ""            # 任务确认表路径（assets/templates/<类型>.yaml 或本次确认记录）
  验证信号: ""          # 【必填】完成时用什么可判定的信号证明成了（测试/校验脚本/断言/人审点）
  熔断状态: ""          # 【可选，留空即「正常」】正常 / 已熔断；熔断与复位都用 checks.py mark：
                        #   置熔断：mark <plan> --fuse 已熔断   复位：mark <plan> --fuse 正常（+ 步骤状态一并复位）
                        #   复位须用户明示，且两步缺一不可（见 SKILL.md「熔断机制」）

steps:
  - id: 1
    做什么: ""          # 本步动作（动词开头）
    输入: ""            # 输入文件/数据/来源
    预期产出: ""        # 预期结果描述
    验证方式: ""        # 怎样算完成（可判定）
    状态: 待办
    交付物: ""          # 【必填】实际文件路径，如 tasks/xxx/报告.md
  - id: 2
    做什么: ""
    输入: ""
    预期产出: ""
    验证方式: ""
    状态: 待办
    交付物: ""
