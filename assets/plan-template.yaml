# 执行计划模板（阶段 3 落盘为 tasks/<任务类型>-<日期>/plan.yaml）
# 键名统一为中文，与 SKILL.md 阶段 3 第 1 条一致。
# status 取值: 待办 / 进行中 / 完成 / 受阻 / 熔断
#   「熔断」= 本步已停止自动化、等待用户决策（见 SKILL.md「熔断机制」）。
#   一旦出现该状态，或下方「熔断状态: 已熔断」，checks.py plan 将直接判 FAIL，
#   并要求同目录存在《熔断报告.md》（含 触发条件/已试路径/卡点根因/待决策选项/复位条件）。
# 交付物: 【必填】该步骤的实际产出文件路径或明确结论位置（阶段 5 Anti-drop 对账完全依赖此字段）
#   ⚠️ 相对路径**只**以 --base=<工作区根> 为基准解析；工作区根之外的文件必须写绝对路径。
meta:
  任务: ""              # 与任务确认表的目标一致
  工作区根: ""          # 【必填】本次任务工作区绝对路径；读写与产出默认限此目录内，越界需用户当次授权
  创建时间: ""          # YYYY-MM-DD HH:mm
  任务层级: ""          # L1 / L2
  确认表: ""            # 任务确认表路径（assets/templates/<类型>.yaml 或本次确认记录）
  验证信号: ""          # 【必填】完成时用什么可判定的信号证明成了（测试/校验脚本/断言/人审点）
  熔断状态: ""          # 【可选，留空即「正常」】正常 / 已熔断；熔断与复位都用 checks.py mark：
                        #   置熔断：mark <plan> --fuse 已熔断   复位：mark <plan> --fuse 正常（+ 步骤状态一并复位）
                        #   复位须用户明示，且两步缺一不可（见 SKILL.md「熔断机制」）
  决策记录: []          # 【可选】自主决策层的"能力决策留痕"，追加不覆盖；用 checks.py decide 写入
                        #   每项：{决策点, 能力类, 依据, 选择, 时间}；前 4 项必填（decide 强制），时间由工具自动填
                        #   能力类取值：知识 / 算力 / 事实 / 手脚（见 references/capability-routing.md）
                        #   ⚠️ 只在**实际引入外部辅助**时追加；"决定不引入"不必留痕
  计划修订: []          # 【可选】自适应计划的"重规划留痕"，追加不覆盖；用 checks.py revise 写入
                        #   每项：{版本: "", 触发: "", 时间: "", 变化: "", 未变: ""}
                        #   触发取值：R1–R6（见 references/adaptive-planning.md）
                        #   ⚠️ 最多 3 条；超过说明初始拆解有问题，应停下来与用户重新对齐目标
  自研工具: []          # 【可选】本任务自行编写的工具/技能登记，追加不覆盖；用 checks.py selftool 写入
                        #   每项：{名称, 用途, 适用场景, 仓库链接} —— 四项均必填（selftool 强制，门禁校验）
                        #   判定口径：① 本任务自写（非复用第三方、非用户既有资产）② 以文件形式落地
                        #   仓库链接须为 http(s) 真实地址（默认 https://github.com/Garvin666/ai-workflow-tools），
                        #   ⚠️ 禁止 `<...>`/TODO/xxx 等占位符；未推送前写「待推送」并在阶段 6 回填
                        #   ⚠️ 代码内与输出中同步标注「自研 + 名称 + 用途 + 适用场景 + 链接」（见 SKILL.md 同名小节）
                        #   ✔ v3.5.0 起另有**漏登记检测**：交付物里出现 `[自研工具]` 标注头却未在本字段
                        #     登记 → `checks.py plan` 出 WARN（只提示、不计入 FAIL、不改退出码）
  越界授权: []          # 【可选】本次任务的越界授权登记（红线③ / 信息安全 S4），追加不覆盖
                        #   每项：{路径, 操作, 依据, 时间} —— 路径须**具体**，禁止目录级泛授权（如 D:\ 下所有）
                        #   顺序永远是「先请求 → 拿到当次同意 → 再执行 → 后登记」；上一任务的授权不延续到本任务
                        #   ✔ v3.5.0 起**有机器校验**：`checks.py plan` 检查项 9 —— 交付物落到工作区根外
                        #     且未在本字段登记即 FAIL；本字段的路径作白名单。旧模板缺此键时只 WARN
                        #     （**不追认历史计划**）。⚠️ 校验的只是「有没有登记」，「依据」无法被机器核实
                        #     —— 它仍是留痕，不是许可。细则与请求格式见 references/security-guide.md 第四节
  不可逆副作用: []      # 【可选，含不可逆动作的任务必填】执行后追加，追加不覆盖（v4.0.0 / U5）
                        #   每项：{时间, 动作, 目标, 可否回滚, 回滚方式}
                        #   「可否回滚」只允许 可回滚/不可回滚/未知 —— **「未知」必须显式写**，
                        #   空值不等于"应该没问题"。（沿用「可选字段、填了就不能糊弄」的既有口径，
                        #   不做成"非空才 PASS"的门禁 —— 那会逼执行者编造。）
                        #   适用：含推送远端/发布上线/删改数据/写生产配置/对外发送的任务；纯本地读写留空。
                        #   ✔ v4.0.0 起**有机器校验**：登记项缺 `可否回滚` 或其值越界 → FAIL；
                        #     命中不可逆关键词却留空 → SKIP（**不 FAIL**："是否该有副作用"无法机器判断）
  用户放行: []          # 【可选】红线①「用户确认前不执行」的**留痕**（v4.0.0 / U2）
                        #   每项：{时间, 摘要} —— 摘要为用户**原话**摘要，不是执行者的转述
                        #   ⚠️ **它做不到真正的机器强制** —— 执行者可以自己填写。它只能提高伪造成本。
                        #   依据在技能自己身上：SKILL.md 写着「写在提示里的熔断不是熔断，是建议」；
                        #   同理，**一个可自填的字段不是门禁**。字段注释里必须原样保留这句，否则就是自欺。
                        #   ✔ v4.0.0 起：留空 → SKIP（提示，不 FAIL）；填了但缺 `时间`/`摘要` → FAIL

steps:
  - id: 1
    做什么: ""          # 本步动作（动词开头）
    输入: ""            # 输入文件/数据/来源
    预期产出: ""        # 预期结果描述
    验证方式: ""        # 怎样算完成（可判定）
    状态: 待办
    交付物: ""          # 【必填】实际文件路径，如 tasks/xxx/报告.md
    模型档位: ""        # 本步模型档位，取值见 references/routing-guide.md（唯一口径源）：
                        #   strong = 规划/关键实现/安全相关；mid = 常规实现；cheap = 探索·调研·测试·文档
                        #   default = 显式声明「按阶段默认档位」（等价于留空，用于需要写明意图时）
                        #   ⚠️ 填空/填值都合法，但填了就必须是上面四个之一 —— checks.py plan 有「模型档位合法」判据
  - id: 2
    做什么: ""
    输入: ""
    预期产出: ""
    验证方式: ""
    状态: 待办
    交付物: ""
