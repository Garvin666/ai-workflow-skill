# 作业解题类任务确认表模板（沉淀自 2026-09-23 ai-workflow v4.7.0「作业模式」新增）
# 用途：同类作业（同一课程 / 同一题型的多题作业）第二次起可走 L1 快速通道 —— 结构仍按 references/homework-mode.md 的 H1–H5，但免重复追问
task_type: 作业解题
confirmed_at: 2026-09-23
workspace: ""          # 【必填】本次任务的工作区根目录（绝对路径）；产出只允许落在此目录内
goal: "按大学生解题流程完成给定作业题：H1 审题与已知条件提取 → H2 思路分析与知识点关联 → H3 分步推导/求解 → H4 关键步骤解释 → H5 答案呈现与验证；题型骨架按 references/homework-mode.md §4 选（数学计算 / 编程实现 / 论述写作 / 其他题型映射）"
inputs:
  - "用户给出的题目原文（含题号、小问编号、单位与格式要求）"
  - "题目所属教材/章节（用户提供时；用于知识点定位，未提供则不猜）"
  - "题目限定的条件（如「必须用拉格朗日法」「字数 800 字以上」「只能用标准库」）"
deliverable:
  format: "会话内结构化解答（Markdown）；用户要求交文件时按阶段 4 输出（.md / .docx / .pdf）"
  path: "当前工作区根目录或 tasks/作业解题-<YYYY-MM-DD>/"
  naming: "解答-<课程或主题>-<YYYY-MM-DD>.md"
  length: "按题目要求（如无要求：单题不限，论述题按题目字数区间）"
  note: "多题作业每题独立成块 + 末尾给「题号 → 答案摘要 → 验证方式」对照表，便于自查漏题"
  extra: "编程题与实验题必须附真实运行的原始输出（含题给样例）；此类证据放 tasks/<任务>/tmp/ 留档"
acceptance:
  - "题干重述与已知条件逐项列出，含隐含条件、单位与量纲、小问数"
  - "知识点与解法给出选择理由；存在多条可行路径时说明取舍"
  - "推导不跳步，跳步处标注并给出可复算的中间量"
  - "至少 1-2 处关键步骤解释（为什么这么做 / 替代做法为何不行 / 常见错误）"
  - "最终答案单独成块，含单位、有效数字与取值域约束"
  - "验证真做且出示证据：数学=代回或量纲或特例；编程=真实运行的原始输出+边界用例；论述=引用真实可核（外链经 http_fetch.py --check-links 探活）"
  - "逐问核对无漏问；结论与题问一一对应"
  - "未验证的推断已显式标注；不确定的题已标注不确定（不得用自信语气掩盖）"
constraints:
  - "I1 不得伪造执行输出：未运行就说未运行"
  - "I2 不得编造文献、数据与引用；记不清标注「待核实」"
  - "I3 不得把未验证的推断写成已验证；估算值必须标注「估算」"
  - "I4 用户明示为考试/测评/要求独立完成时，不代做，改为方法讲解与自查思路"
  - "不因「这是道题」而降低验证门槛：该跑就跑，与代码类任务同标准"
  - "涉及时效性事实（最新数据、现行标准、软件版本）必须检索，不得凭记忆作答"
research: []
flow: "作业识别（C1-C3）→ 分层判定（L0 直接答 / L1 命中模板复跑 / L2 全流程）→ H1 审题 → H2 思路 → H3 求解 → H4 关键步骤解释 → H5 答案与验证 → 自检清单（references/homework-mode.md §9）→ 交付"
