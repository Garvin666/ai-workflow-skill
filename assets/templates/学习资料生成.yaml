# 学习资料生成类任务确认表模板（差异化要求见 references/playbook.md 第四节）
task_type: 学习资料生成
confirmed_at: ""
workspace: ""          # 【必填】本次任务的工作区根目录（绝对路径）；产出只允许落在此目录内
goal: "围绕指定知识范围产出可复习、可自测的学习资料（PDF/HTML 双格式）"
inputs:
  - "知识范围与教材/论文出处（待填）"
  - "目标场景：期末复习 / 考研 / 竞赛 / 自学（决定详略与题型）"
deliverable:
  format: "PDF（复习用）+ HTML（交互/速查用，单文件自包含、离线可开）"
  path: "tasks/学习资料生成-<YYYY-MM-DD>/"
  naming: "<科目>-<范围>-知识总结-<YYYY-MM-DD>.pdf/.html"
acceptance:
  - "每条结论标教材章节/论文出处；公式给出推导关键步而非只给结果"
  - "分层输出：一页速览（结论+公式表）→ 详解（推导+例题）→ 自测题（含答案与解析）"
  - "知识点覆盖度对齐：每个知识点 ≥1 道自测题"
  - "公式渲染正确（HTML 用 KaTeX/MathJax；PDF 无字体缺字乱码）"
constraints:
  - "禁止幻觉：不确定的定义/定理标注『待核实』或先检索确认，不得编造公式"
  - "HTML 单文件自包含，不依赖外部 CDN 也能打开（或明确标注需联网）"
research:
  - item: ""
    decision: ""
    date: ""
flow: "确认范围与场景 → 知识框架 → 分层撰写 → 公式渲染校验 → 自测题配答案 → 双格式输出 → 复盘沉淀"
