# 文献阅读类任务确认表模板（沉淀自 2026-09-30 ai-workflow v4.17.0「文献阅读模式」新增）
# 用途：同类文献审阅（同一课程/同一方向的连续多篇）第二次起可走 L1 快速通道 —— 结构仍按 references/literature-reading-mode.md 的 Q1–Q4，但免重复追问
# ⚠️ v4.23.0 起：本模板对应「文献阅读模式」，该模式**亦为科研模式的 R2「文献精读」子阶段**（双轨）。
#    - 独立入口（用户只说"读这篇文献/审稿意见"）⇒ 直接用本模板，**不展开 R0–R6**；
#    - 在科研活动中 ⇒ R2 按本模板，但**整体须走** `research-mode.yaml` 的 R0–R6（本模板仅覆盖其中 R2 一环）。
#    - **文件名不变**（防既有 plan.yaml 按名引用断裂，见 references/research-mode.md §9）。
#    - 全链模板见同目录 `research.yaml`；结构规范：R0–R6 见 references/research-mode.md，R2 见 references/literature-reading-mode.md。
task_type: 文献阅读
confirmed_at: 2026-09-30
workspace: ""          # 【必填】本次任务的工作区根目录（绝对路径）；产出只允许落在此目录内
goal: "以严苛审稿人视角审阅给定文献：Q1 研究问题 → Q2 创新点 → Q3 可质疑点 → Q4 精读/略读分区；四问均标注内容维度（主张层 claim / 证据层 evidence / 结构层 structure），并遵守 references/literature-reading-mode.md 的证据分级 A/B/C/D"
inputs:
  - "文献本体（PDF / 预印本链接 / 全文文本）；仅提供摘要或链接时按手册 §7 降级"
  - "阅读目的（用户给定优先；未给定则按默认目的「判断其贡献是否可信」并在产出中声明）"
  - "文献的页码或章节结构信息（用于位置锚；拿不到时按手册 §5.2 标 [位置不可得]）"
deliverable:
  format: "会话内结构化审阅（Markdown）；用户要求交文件时按阶段 4 输出（.md / .docx / .pdf）"
  path: "当前工作区根目录或 tasks/文献阅读-<YYYY-MM-DD>/"
  naming: "文献审阅-<短标题或编号>-<YYYY-MM-DD>.md"
  length: "按用户要求；无要求时四问各 1 段起，Q3 按质疑条数展开"
  note: "每条关于文献内容的陈述带证据档标记；Q1/Q2 带位置锚；多篇同批审阅时每篇独立成块，末尾给「文献 → 一句话结论 → 是否值得精读」对照表"
  extra: "读取失败（扫描件无 OCR / 编码损坏）时附原始报错，不猜内容；证据档汇总计数（A/B/C/D 各几条）可附于文末供自查"
acceptance:
  - "四问齐全，且每问标出所属内容维度（主张层 / 证据层 / 结构层）"
  - "Q1/Q2 的每条陈述有位置锚（章节号或页码）；拿不到位置的已标 [位置不可得] 并说明原因"
  - "Q3 每条质疑指向原文具体位置，并区分「作者已自认的局限」与「作者未提及、我发现的」"
  - "Q4 三段分区（精读/略读/可跳过）绑定明确的阅读目的，并给出分区理由"
  - "生成层（Q3/Q4）中属审稿人判断的部分均带 [C] 标记或等效措辞"
  - "读不到、原文未提供、存在歧义的部分均以 [D] 明说，无静默略过项"
  - "未用记忆中的外部文献补强或驳倒本文；未对作者做人身或动机评价"
  - "结论强度与证据强度匹配；未把「作者声称」写成「已经做到」"
constraints:
  - "不得编造：关于文献内容的陈述不得出现原文没有的说法"
  - "无法确认的信息必须明说（[D] 档），不得用自信语气掩盖"
  - "不得用外部知识补强作者论证（P4）；确需对比须先检索核实并声明来源为外部"
  - "不评作者动机与人身；只评文本与论证"
  - "本模式不判断文献结论的真伪（那需复现或反例），只判论证链的薄弱处"
  - "仅拿到摘要时 Q3/Q4 整体降为 D 档，不得从摘要推测方法缺陷"
research:
  - "文献本体获取（用户提供优先；需自行下载时先确认访问范围与版权边界）"
  - "仅当用户要求「与该方向其他工作对比」时才需外部检索，且结果须标为外部来源"
flow: "文献识别（R1-R3）→ 分层判定（L0 直接答 / L1 命中模板复跑 / L2 全流程）→ 角色契约 P1-P4 → Q1 研究问题（主张层）→ Q2 创新点（主张层）→ Q3 可质疑点（证据层）→ Q4 精读/略读（结构层）→ 证据档标注核对 → 自检清单（references/literature-reading-mode.md §8）→ 交付（在科研模式下即 R2 一环，见 references/research-mode.md）"
