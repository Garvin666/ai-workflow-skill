# 调研报告类任务确认表模板（快速通道用）
# 最近一次实跑：2026-09-10《调研-GPT与纳维斯托克斯难题》（PDF 深度技术分析变体）
# 两档变体：① 轻量版=Markdown 报告（默认）；② 深度技术分析版=PDF（HTML→Chrome headless --print-to-pdf），见 deliverable.note
task_type: 调研报告
confirmed_at: 2026-09-10
workspace: ""          # 【必填】本次任务的工作区根目录（绝对路径）；产出只允许落在此目录内
goal: "调研指定主题的可落地内容，覆盖方法论 / 工具 / 实践 / 评估四方向，产出 Markdown 调研报告"
inputs:
  - "用户给定主题与范围（示例：全面覆盖 方法论+工具+编排实践+质量评估 四方向）"
  - "WebSearch 中英文各 ≥1 轮 + GitHub API 实测 star/许可证/活跃度"
  - "今日已完成同类调研作为基线，避免重复覆盖"
deliverable:
  format: "Markdown（轻量版）／ PDF（深度技术分析版，见 note）"
  path: "tasks/调研-<主题>-<YYYY-MM-DD>/"
  naming: "调研-<主题>-<YYYY-MM-DD>.md｜调研-<主题>-<YYYY-MM-DD>.pdf（同目录保留 findings-*.md 与一手素材原文）"
  note: "轻量版=既有资料盘点表+项目对比表+落地建议+避坑清单；深度技术分析版（PDF）=裁定总表+时间线表+数学底座原文精译+机制解释+形式化可信度边界+争议双方立场+独立裁定+判据清单+来源探活表。PDF 生成路径：report.html（@page A4、light 主题、中文字体栈）→ Chrome --headless --no-pdf-header-footer --print-to-pdf，产出后用 pypdf 读回校验页数与关键词"
acceptance:
  - "每方向 ≥2 个代表项目/方法，且与已有调研不重复"
  - "含既有资料盘点表 + 项目对比表（GitHub API 实测 star/许可证/pushed_at）"
  - "结论标注证据等级（RCT/基准实测/官方推荐/实践观点），厂商案例与营销倍数不得作证据"
  - "免费与商业方案均衡对比 + 面向用户环境的落地路线图 + 避坑清单"
  - "引用标明来源 URL"
  - "深度技术分析版追加：① 逐条裁定『当事方声称』vs『已独立验证』；② 一手材料必须亲自下载核验（PDF 用 pypdf 提取后逐字比对引语），不得只依赖子代理转述；③ 涉形式化验证成果必须写明『保证什么／不保证什么』（规格鸿沟）；④ 争议须同时给出指控方与回应方立场，并标明『未证实』项"
constraints:
  - "只调研不写代码"
  - "中文输出"
  - "黑名单项目（RouteLLM/GPTCache/Memobase）只参考思路不推荐为依赖"
  - "检索方向 ≥3 个时必须并行派发子代理，禁止串行等待"
research:
  - item: "OpenAI 宣称 AI 解出纳维–斯托克斯千禧年难题（2026-09-08）"
    decision: "已完成：tasks/调研-GPT与纳维斯托克斯难题-2026-09-10/。核心结论=① 事件真实（166 页论文+Lean 仓库实测存在）；② 『解出千禧年难题』不成立（只对应 C/D 反例命题，非 A/B；无同行评审；Clay 仍列未解）；③ Lean 只保证推导无误、不保证命题编码忠实（规格鸿沟）；④ 争议属优先权与信用分配纠纷，指控方自陈『未指控任何人』，双方均大量使用 LLM；⑤ 通用教训=审阅 AI 数学宣称的三问（解的是哪个命题／是否过审／题面谁写的）"
    date: "2026-09-10"
  - item: "AI 工作效率与质量提升（方法论/工具/编排实践/质量评估）"
    decision: "已完成：tasks/调研-AI效率-2026-09-10/；核心结论=验证闭环优先、上下文文件极简、变异测试取代覆盖率、评审防偏差"
    date: "2026-09-10"
  - item: "模型路由与工作流编排产业格局"
    decision: "已完成（另一份）；结论：价值从模型层上移到聚合路由+网关+编排控制面"
    date: "2026-09-10"
flow: "分层判定 → 查模板/查 Skill → 1 轮追问确认 → 并行检索(≥3 方向) + GitHub 实测 → 汇总报告 → Anti-drop 自检 → 交付 → 复盘沉淀"
