# 调研报告类任务确认表模板（快速通道用）
# 最近一次实跑：2026-09-10《调研-AI工作效率与质量提升》
task_type: 调研报告
confirmed_at: 2026-09-10
goal: "调研指定主题的可落地内容，覆盖方法论 / 工具 / 实践 / 评估四方向，产出 Markdown 调研报告"
inputs:
  - "用户给定主题与范围（示例：全面覆盖 方法论+工具+编排实践+质量评估 四方向）"
  - "WebSearch 中英文各 ≥1 轮 + GitHub API 实测 star/许可证/活跃度"
  - "今日已完成同类调研作为基线，避免重复覆盖"
deliverable:
  format: "Markdown"
  path: "tasks/调研-<主题>-<YYYY-MM-DD>/"
  naming: "调研-<主题>-<YYYY-MM-DD>.md（同目录保留子代理 findings-*.md 中间产物）"
  note: "既有资料盘点表 + 项目对比表（含实测数据）+ 落地建议 + 避坑清单；与已有调研显式划界"
acceptance:
  - "每方向 ≥2 个代表项目/方法，且与已有调研不重复"
  - "含既有资料盘点表 + 项目对比表（GitHub API 实测 star/许可证/pushed_at）"
  - "结论标注证据等级（RCT/基准实测/官方推荐/实践观点），厂商案例与营销倍数不得作证据"
  - "免费与商业方案均衡对比 + 面向用户环境的落地路线图 + 避坑清单"
  - "引用标明来源 URL"
constraints:
  - "只调研不写代码"
  - "中文输出"
  - "黑名单项目（RouteLLM/GPTCache/Memobase）只参考思路不推荐为依赖"
  - "检索方向 ≥3 个时必须并行派发子代理，禁止串行等待"
research:
  - item: "AI 工作效率与质量提升（方法论/工具/编排实践/质量评估）"
    decision: "已完成：tasks/调研-AI效率-2026-09-10/；核心结论=验证闭环优先、上下文文件极简、变异测试取代覆盖率、评审防偏差"
    date: "2026-09-10"
  - item: "模型路由与工作流编排产业格局"
    decision: "已完成（另一份）；结论：价值从模型层上移到聚合路由+网关+编排控制面"
    date: "2026-09-10"
flow: "分层判定 → 查模板/查 Skill → 1 轮追问确认 → 并行检索(≥3 方向) + GitHub 实测 → 汇总报告 → Anti-drop 自检 → 交付 → 复盘沉淀"
