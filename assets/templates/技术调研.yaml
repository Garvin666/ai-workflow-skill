# 技术调研类任务确认表模板（沉淀自 2026-09-10 模型路由与工作流编排调研）
task_type: 技术调研
confirmed_at: 2026-09-10
goal: "围绕给定主题完成产业格局 + 技术路线 + 开源项目对比 + 落地建议四维调研；若主题是「增强自身能力」，则交付物追加可执行改造方案"
inputs:
  - "用户给定调研主题与侧重方向"
  - "WebSearch + GitHub API 开源查重"
  - "若是能力增强类：先只读盘点现状能力与真实短板（产出缺口清单，避免泛泛调研）"
deliverable:
  format: "Markdown"
  path: "当前工作区根目录或 tasks/技术调研-<YYYY-MM-DD>/"
  naming: "调研-<主题>-<YYYY-MM-DD>.md"
  length: "4000-6000 字（统计口径：汉字+英文单词+数字，即 Word 字数口径）"
  note: "调研任务查重=检索既有报告/横评避免重复劳动，GitHub API 仅作数据源实测，不作为查重对象"
  extra: "能力增强类主题追加「改造方案-<能力>增强.md」：每个缺口写明 补/不补 + 理由 + 选定方案 + 落地改动点 + 依赖代价 + 建议顺序"
acceptance:
  - "关键论断附来源链接（来源可溯）"
  - "含项目对比矩阵表"
  - "结论部分给出明确判断与落地建议"
  - "结论标注证据等级，厂商案例与营销倍数不作为证据"
  - "候选方案 ≥20 条且每条含可访问链接；GitHub 指标全部实测（禁二手 star）"
  - "交付物中的外链经 --check-links 探活；404/403/429/502 分类标注，不得混为一谈"
  - "含反例/不推荐项（写明被高估或已停更的方案及其证据）"
constraints:
  - "不产出 Office 文档"
  - "引用标明 URL"
  - "先查重后写稿"
  - "检索方向 ≥3 个时并行派发子代理，不串行等待"
  - "子代理产出的链接必须全量探活后才可进交付物（实测会编造日期型假链接）"
research:
  - item: "模型路由 / 网关 / 工作流编排产业格局"
    decision: "已完成 2026-09-10；结论：价值从模型层上移到聚合路由 + 网关治理 + 编排控制面三层"
    date: "2026-09-10"
  - item: "工作流检索能力（GitHub搜索/本地索引/结构化检索/去重聚合）"
    decision: "已完成 2026-09-10；结论：P0 GitHub Search API 零依赖可补（已实测调用成功）；P1a 结构化大数据集用 DuckDB 直查、P1b 用 ugrep --index（ripgrep 无索引）；P2 只加 ast-grep（comby 实测停更、CodeQL 许可不合规）；P3 不新增工具只固化 SOP"
    date: "2026-09-10"
flow: "分层判定 → 查模板 → 1 轮追问确认 → 并行检索 + GitHub 实测 → 报告 → Anti-drop 自检 → 交付 → 复盘沉淀"
