# 网络小说写作类任务确认表模板（10 项自查清单见 references/playbook.md 第三节）
task_type: 小说写作
confirmed_at: ""
workspace: ""          # 【必填】本次任务的工作区根目录（绝对路径）；产出只允许落在此目录内
goal: "按既定设定与大纲完成章节写作/修订，保持人设与前文一致、无 AI 腔、无合规风险"
inputs:
  - "前 5 章原文 + 大纲 + 设定锚点表 + 章标题登记表（必须全部读过再动笔）"
  - "本次章节的目标字数、剧情推进点、章末钩子设计（待填）"
deliverable:
  format: "MD（写作底稿）+ Word（投稿/存档双格式）"
  path: "tasks/小说写作-<YYYY-MM-DD>/"
  naming: "第NNN章-标题.md"
  length: "每章 2000-2400 字（番茄平台口径）；日更 2000 字"
acceptance:
  - "10 项自查全部通过：爽点轮换、章末两层钩子、设定锚点、前文承接、人设一致、对话占比、节奏（无流水账）、无 AI 腔、合规、标题查重"
  - "字数落在 2000-2400 区间（脚本统计，非目测）"
  - "章标题与登记表无重复，并已登记新章标题"
constraints:
  - "涉政/涉黄/涉暴/迷信等敏感内容零容忍"
  - "禁止'总之/综上/值得注意的是'类书面语与四字排比堆砌；避免章节结构雷同"
  - "存稿达 2.5-3 万字后再启动申签流程"
research:
  - item: ""
    decision: ""
    date: ""
flow: "读前文与设定 → 确认剧情点与钩子 → 写作 → 10 项自查 → 字数核准 → 标题登记 → 双格式输出 → 复盘沉淀"
