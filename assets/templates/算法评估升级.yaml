# 算法评估升级类任务确认表模板（沉淀自 2026-09-17 K 折验证增益升级任务）
task_type: 算法评估升级
confirmed_at: 2026-09-17
workspace: ""          # 【必填】本次任务的工作区根目录（绝对路径）；产出只允许落在此目录内
goal: "把 <旧判据> 升级为 <新判据>，并以三臂对照实验量化升级前后的收益（误判消除 / 判据稳定性 / 策略后悔值 / 代价实测）"
inputs:
  - "旧判据实现（文件路径）与其历史结果台账（CSV/JSON）"
  - "被测对象（模型/适配层/流水线）与既有对照基线产物树"
  - "既有自检/单测入口"
deliverable:
  format: "代码 + HTML 报告"
  path: "tasks/<主题>-<YYYY-MM-DD>/；报告落被测项目根目录"
  naming: "<主题>收益对比报告-<YYYY-MM-DD>.html + 代码升级说明-<主题>.html"
  note: "报告须给出四口径量化数字：误判消除 / 判据稳定性 / 策略后悔值 / 代价实测"
acceptance:
  - "回归：旧判据路径在新 harness 下复现历史台账（按记录精度逐格一致）"
  - "旧行为已知反例在新判据下被正确处置（逐例列出是与否）"
  - "未涉及组不劣化：判定结论与下游指标不变，逐组差异表列出"
  - "旧产物树 sha256 清单在开工与收工两次快照一致（证明对照基线未被污染）"
  - "冻结/隔离类前置约束复检通过（如底座指纹、mmguard verify、mmcheck）"
constraints:
  - "改判定行为 ⇒「输出与旧版逐字节一致」这条性能类验收【不适用】，须显式声明替代信号"
  - "旧判据实现原地保留，不原地替换（否则对照基线不可重跑）"
  - "新产物落独立输出树，不污染旧树"
  - "早停/调参所用的集合与判据评估所用的集合必须分离，否则判据带乐观偏差"
  - "成本对比必须在同进程内交替执行新旧实现，不得拿整机墙钟前后对比"
research:
  - item: "新判据的折数与切分策略"
    decision: "按数据类型分策略：独立同分布用 KFold；时序用固定窗前向滑动（不用 TimeSeriesSplit 默认——后者训练量逐折递增，首折欠训练会被误读成「适配层不行」）"
    date: "2026-09-17"
  - item: "每折是否重拟合被冻结的底座"
    decision: "重拟合，且拟合在整折训练区（非折内早停子集）。拟合在早停子集会让判定块偏大 ⇒ 增益被系统性抬高"
    date: "2026-09-17"
  - item: "收益结论的抽样口径"
    decision: "单一数据划分的结论不可信（实测同一判据在不同划分种子下策略损失改善 0% ↔ 13.5%）。必须跨 ≥10 个划分种子扫描后取聚合值"
    date: "2026-09-17"
flow: "归档 .orig + 快照旧树 → 实现新判据(保留旧) → 驱动脚本加模式开关 → 自检扩项 → 回归复现旧台账 → 三臂对照实验 → 稳定性扫描 → 成本受控 A/B → 收益报告 → 改动说明 → 模板同步与冻结复检"
