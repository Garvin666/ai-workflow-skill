task_type: "UI组件库搭建"
confirmed_at: "2026-09-10"
workspace: "E:\\ChatGPT\\ui库"
goal: "从零搭建自用 React 组件库，双入口分层（主入口零依赖 + 3D 可选入口），CSS 变量驱动主题，产出可运行工程与本地 dist，供本机其他项目复用"
inputs:
  - "无外部设计稿；API 与令牌分层参照 Ant Design / shadcn / Radix / drei 的成熟实践"
deliverable:
  format: "可运行源码工程 + dist 产物（本地 file: 引用）+ 演示页"
  path: "E:\\ChatGPT\\ui库\\"
  naming: "src/components/<组件名>/index.tsx + <组件名>.css；3D 入口 src/three/；演示页 examples/App.tsx"
  note: "不配置 npm 发布（无 publishConfig / 无 CI 发布流水线）"
acceptance:
  - "npx tsc --noEmit 退出码 0"
  - "npx vite build 退出码 0 且产出 dist"
  - "主入口构建产物中 three 引用数为 0（grep 实测）"
  - "Button：variant(primary/secondary/ghost/danger) × size(sm/md/lg) × disabled/loading"
  - "Input：受控+非受控、前后缀、clearable、disabled、错误态"
  - "Card：header/body/footer 插槽、bordered、hoverable"
  - "CSS 3D 组件在 prefers-reduced-motion 下自动降级为无动画"
  - "ModelViewer 加载 glb：有进度、失败兜底、自动旋转开关"
  - "Chart3D 传数据数组即渲染，hover 有高亮与数值提示"
constraints:
  - "主入口严格零第三方 UI 依赖（仅 react/react-dom 为 peer）"
  - "three 只允许出现在 3D 入口，写成 optional peer 依赖"
  - "不发布 npm、不推送远端（需要时单独确认）"
  - "读写与产出严格限制在工作区根内"
  - "⚠️ React 版本必须锁 19.2.x：@react-three/fiber@9.7 的 peer 是 react >=19 <19.3，装 19.3 直接 ERESOLVE 失败（2026-09-10 实测）"
  - "⚠️ 若要求「按需引入」，需明确是 JS 运行时按需还是含 CSS：Vite 库模式默认把多入口样式合并成单个 ui.css，按需的只是 JS"
research:
  - item: "shadcn-ui/ui（123503★ MIT）"
    decision: "仅借鉴 API 命名与令牌分层；源码强绑 Tailwind，不采用"
    date: "2026-09-10"
  - item: "ant-design/ant-design（99466★ MIT）"
    decision: "仅借鉴尺寸档位与 API 命名，不引入"
    date: "2026-09-10"
  - item: "mkosir/react-parallax-tilt（1079★ MIT 活跃）"
    decision: "备选可直用，但会破坏主入口零依赖红线 → 自研 TiltCard"
    date: "2026-09-10"
  - item: "pmndrs/react-three-fiber（32233★ MIT）+ pmndrs/drei（9862★ MIT）"
    decision: "直接复用为 3D 底座，仅自研业务外壳"
    date: "2026-09-10"
  - item: "google/model-viewer（8233★ Apache-2.0）"
    decision: "不采用（Web Component，与 React 集成需额外包装，且多一套 3D 栈）"
    date: "2026-09-10"
flow: "阶段2 查重与方案评审 → 落盘 plan.yaml → 骨架 → 令牌 → 批次A(基础) → 批次B(CSS 3D) → 批次C(Three 场景) → 批次D(可视化) → 演示页 → 构建验证 → 单独送审或抽查豁免 → 交付台账"
