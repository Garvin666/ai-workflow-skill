# 量化分析类任务确认表模板（差异化要求见 references/playbook.md 第一节）
task_type: 量化分析
confirmed_at: ""
workspace: ""          # 【必填】本次任务的工作区根目录（绝对路径）；产出只允许落在此目录内
goal: "对指定策略/因子/数据集完成分析或实现，产出可复现的数值结论与报告"
inputs:
  - "行情/财务数据源与时间区间（待填）"
  - "策略或因子定义、调仓频率、手续费与滑点假设（待填）"
deliverable:
  format: "Markdown 报告 + CSV/xlsx（必要时）"
  path: "tasks/量化分析-<YYYY-MM-DD>/"
  naming: "<策略或因子名>-分析报告-<YYYY-MM-DD>.md"
  note: "图表用红涨绿跌（中国市场惯例）；须含数据完整性说明与风险提示"
acceptance:
  - "验收信号可数值化：收益/回撤/夏普、因子 IC/IR 或对账差额（误差=0）"
  - "数据三查通过：行数一致、时间戳无缺口、空值率已报告"
  - "前视偏差自查清单已列出（用到的未来信息字段及处理方式）"
  - "结论标注证据等级，参数与阈值来源可溯"
constraints:
  - "资金/交易/权限相关代码禁止纯 AI 生成，必须人工逐行复核"
  - "禁止改动原始数据文件；停牌/除权除息须显式处理，不得静默前向填充"
  - "依赖仅限 venv 内已装库"
research:
  - item: ""
    decision: ""
    date: ""
flow: "确认口径 → 数据三查 → 前视偏差自查 → 分析/实现 → 数值验收 → 报告 → Anti-drop 自检 → 复盘沉淀"
