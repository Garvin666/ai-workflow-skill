# 跨境电商选品类任务确认表模板（差异化要求见 references/playbook.md 第二节）
task_type: 选品分析
confirmed_at: ""
workspace: ""          # 【必填】本次任务的工作区根目录（绝对路径）；产出只允许落在此目录内
goal: "基于多源数据完成选品决策，产出评分表与分档结论"
inputs:
  - "数据源清单：平台榜单/关键词工具/竞品页/物流报价（待填，逐项标来源与抓取时间）"
  - "筛选维度与权重（需求/竞争/利润/合规）（待填）"
deliverable:
  format: "Excel 选品表（含评分列与筛选条件）+ Markdown 分析报告"
  path: "tasks/选品分析-<YYYY-MM-DD>/"
  naming: "选品决策表-<YYYY-MM-DD>.xlsx ／ 选品分析报告-<YYYY-MM-DD>.md"
acceptance:
  - "数据源台账完整（字段级来源/时间/口径，含汇率与含税换算规则）"
  - "跨源聚合前抽样对账 ≥10 条，结论可解释（权重与阈值来源明确）"
  - "分档输出（强烈推荐/观察/淘汰）+ 每条理由"
  - "抓取合规：遵守 robots 与频率限制"
constraints:
  - "禁止黑箱打分，评分规则必须可复算"
  - "抓取脚本须带限速与重试（复用 http_fetch.py 退避逻辑）"
  - "结论不得使用未经核实的二手平台数据"
research:
  - item: ""
    decision: ""
    date: ""
flow: "确认维度权重 → 数据源台账 → 抓取(限速) → 抽样对账 → 评分分档 → Excel+报告 → Anti-drop 自检 → 复盘沉淀"
