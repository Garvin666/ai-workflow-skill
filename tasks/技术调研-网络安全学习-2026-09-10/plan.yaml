meta:
  任务: 网络安全学习资源调研——入门到进阶的学习路径 + 免费优质书籍/课程/靶场/证书路线，并结合量化项目安全加固需求给出优先级
  创建时间: "2026-09-10 12:36"
  任务层级: L1（命中 assets/templates/技术调研.yaml）
  确认表: assets/templates/技术调研.yaml（本轮新增主题字段：网络安全学习资源；交付物增加 xlsx 进度表）
  验证信号: ① 资源条目 ≥25 条且每条含可访问链接；② 随机抽查 ≥8 个链接实测可达（http_fetch 抓取状态码）；③ 进度表 xlsx 写入后用 office_io 读回校验；④ checks.py plan 对账全绿
steps:
  - id: 1
    做什么: 落盘计划并派发 3 个并行子代理（路径与课程 / 书籍与证书 / 中文资源与工具链）
    输入: assets/templates/技术调研.yaml + 用户背景（量化项目安全加固、数学背景、免费优先）
    预期产出: 3 份 findings 笔记
    验证方式: 每份含 ≥8 条资源且标来源 URL 与证据等级
    状态: 完成
    交付物: tasks/技术调研-网络安全学习-2026-09-10/findings-1-路径与课程.md、tasks/技术调研-网络安全学习-2026-09-10/findings-2-书籍与证书.md、tasks/技术调研-网络安全学习-2026-09-10/findings-3-中文资源与工具链.md
  - id: 2
    做什么: 汇总并撰写调研报告（学习路径分级 + 资源清单 + 与量化项目结合的优先主题 + 避坑）
    输入: 三份 findings
    预期产出: Markdown 调研报告
    验证方式: 对照技术调研模板验收标准逐项核对（来源可溯、含对比表、结论明确）
    状态: 完成
    交付物: tasks/技术调研-网络安全学习-2026-09-10/调研-网络安全学习资源-2026-09-10.md
  - id: 3
    做什么: 链接存活抽查（≥8 个关键资源链接实测）作为验证闭环证据
    输入: 报告中的关键资源链接
    预期产出: 链接抽查结果（写入报告附录）
    验证方式: 实测状态码，失败项标注
    状态: 完成
    交付物: tasks/技术调研-网络安全学习-2026-09-10/链接抽查结果.txt
  - id: 4
    做什么: 生成学习进度表 xlsx（分阶段任务清单 + 勾选列）并读回校验
    输入: 报告中的学习路径分级
    预期产出: 可勾选的进度表
    验证方式: office_io excel-read 读回内容与设计一致
    状态: 完成
    交付物: tasks/技术调研-网络安全学习-2026-09-10/网络安全学习进度表.xlsx
  - id: 5
    做什么: Anti-drop 对账 + 交付
    输入: 全部交付物
    预期产出: 对账结果 + present_files
    验证方式: checks.py plan 全绿
    状态: 完成
    交付物: tasks/技术调研-网络安全学习-2026-09-10/plan.yaml
