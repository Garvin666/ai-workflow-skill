meta:
  任务: ai-workflow 技能 v1 → v2.0 改造（分层提速 + 注入调研硬证据 + 补复盘闭环 + 拆分 references + 修复 4 缺陷）
  创建时间: "2026-09-10 11:55"
  任务层级: L2
