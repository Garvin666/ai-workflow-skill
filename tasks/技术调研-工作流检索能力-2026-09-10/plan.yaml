meta:
  任务: 提升 ai-workflow 工作流自身的检索能力——按体检查出的 4 个真实缺口（P0 GitHub 只能取不能搜 / P1 无本地索引层 / P2 仅行级正则 / P3 多来源无去重聚合）调研 GitHub 开源方案，产出候选对比表与改造方案
  创建时间: "2026-09-10 13:00"
  任务层级: L1（命中 assets/templates/技术调研.yaml，主题字段更新为「工作流检索能力」）
  确认表: assets/templates/技术调研.yaml（本轮更新主题与交付物：增加「改造方案」）
  验证信号: ① 候选方案 ≥20 条且每条含可访问链接；② 全部 GitHub 指标由 http_fetch --github-repo 实测（禁二手 star）；③ 关键链接经 --check-links 探活；④ P0-P3 四个缺口每个都有明确结论（补/不补 + 理由 + 选定方案）；⑤ 许可证与停更检查已做；⑥ checks.py plan 对账全绿
steps:
  - id: 1
    做什么: 落盘计划并派发 3 路并行子代理检索（A－GitHub Search API 与仓库/代码搜索类；B－本地索引与大数据集检索类；C－AST 结构化与语义代码检索类）
    输入: 任务确认表 + 现状体检结论（v2.3 脚本能力盘点）
    预期产出: 3 份 findings 笔记
    验证方式: 每份含 ≥8 条候选且标来源 URL 与证据等级，且明确标注「能否嵌入 ai-workflow」
    状态: 完成
    交付物: tasks/技术调研-工作流检索能力-2026-09-10/findings-1-github搜索类.md、tasks/技术调研-工作流检索能力-2026-09-10/findings-2-本地索引类.md、tasks/技术调研-工作流检索能力-2026-09-10/findings-3-结构化与语义检索类.md
  - id: 2
    做什么: 主代理亲自实测所有候选的 GitHub 指标（star/最后提交/许可证）并对外链批量探活
    输入: 三份 findings 中的仓库名单与链接
    预期产出: 实测数据表 + 探活结果
    验证方式: http_fetch --github-repo 并发实测（禁二手数据）；--check-links 探活，死链标注/修正
    状态: 完成
    交付物: tasks/技术调研-工作流检索能力-2026-09-10/实测指标与链接探活.txt
  - id: 3
    做什么: 汇总撰写调研报告（候选方案对比表 + 与 4 个缺口的对应关系 + 反例）
    输入: 三份 findings + 实测数据
    预期产出: Markdown 调研报告
    验证方式: 每个缺口都有候选映射；含对比表；结论明确；反例/不推荐项已列出
    状态: 完成
    交付物: tasks/技术调研-工作流检索能力-2026-09-10/调研-工作流检索能力-2026-09-10.md
  - id: 4
    做什么: 撰写改造方案（每个缺口 1-2 个选定方案 + 落地步骤 + 优先级 + 风险）
    输入: 调研报告结论
    预期产出: 可执行的改造方案文档
    验证方式: P0-P3 每项含「补/不补 + 理由 + 选定方案 + 具体改动点」；标注是否需再确认
    状态: 完成
    交付物: tasks/技术调研-工作流检索能力-2026-09-10/改造方案-检索能力增强.md
  - id: 5
    做什么: Anti-drop 对账 + 交付
    输入: 全部交付物
    预期产出: 对账结果 + present_files
    验证方式: checks.py plan 全绿
    状态: 完成
    交付物: tasks/技术调研-工作流检索能力-2026-09-10/plan.yaml
