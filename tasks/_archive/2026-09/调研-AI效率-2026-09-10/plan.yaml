  - id: 2
    do: GitHub API 复核关键项目 star/许可证/活跃度
    input: 子代理给出的候选项目清单
    expect: 复核记录
    verify: 与 findings 数据交叉一致
    status: 完成
  - id: 3
    do: 汇总撰写最终调研报告（既有资料盘点表 + 项目对比表 + 落地建议 + 避坑清单）
    input: findings-*.md
    expect: 最终 .md 报告
    verify: 对照验收标准逐项核对
    status: 完成
  - id: 4
    do: 自检交付（Anti-drop guard 对账 + present_files）
    input: 最终报告
    expect: 交付完成
    verify: 自检清单全通过
    status: 完成
constraints:
  - 只调研不写代码；中文；引用标明来源
  - 与今日已有两份调研（路由编排/Token优化）划界不重复
  - 黑名单项目只参考思路不推荐为依赖
