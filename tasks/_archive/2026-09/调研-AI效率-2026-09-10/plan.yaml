task: 调研-AI工作效率与质量提升
type: 调研报告
date: 2026-09-10
goal: 调研提升 AI 工作效率与质量的可落地内容，覆盖方法论/开源工具/编排实践/质量评估四方向
deliverable: tasks/调研-AI效率-2026-09-10/调研-AI工作效率与质量提升-2026-09-10.md
steps:
  - id: 1
    do: 并行派发 4 个子代理分方向检索（方法论/工具/编排实践/质量评估），各自落盘 findings 文件
    input: WebSearch + GitHub API
    expect: tasks/调研-AI效率-2026-09-10/findings-*.md × 4，每份含来源链接与实测数据
