# 任务类型: 数据分析（示例模板，首次实际使用后按真实配置覆盖）
goal: 对指定数据集完成清洗、分析并产出结论报告
inputs:
  - 来源: 本地 csv/xlsx 或接口数据（路径待填）
  - 口径: 统计口径与时间范围待填
deliverables:
  - 报告: docx/xlsx，路径与命名待填
