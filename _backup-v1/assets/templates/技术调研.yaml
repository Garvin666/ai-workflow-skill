# 技术调研任务确认表模板（示例沉淀自 2026-09-10 模型路由与工作流编排调研）
task_type: 技术调研
goal: "围绕给定主题完成产业格局 + 技术路线 + 开源项目对比 + 落地建议四维调研"
inputs:
  - "用户给定调研主题与侧重方向"
  - "WebSearch + GitHub API 开源查重"
deliverable:
  format: "Markdown"
  path: "当前工作区根目录"
  naming: "调研-<主题>-<YYYY-MM-DD>.md"
  length: "4000-6000 字（统计口径：汉字+英文单词+数字，即 Word 字数口径）"
  note: "调研任务查重=检索既有报告/横评避免重复劳动，GitHub API 仅作数据源实测，不作为查重对象"
acceptance:
  - "关键论断附来源链接（来源可溯）"
  - "含项目对比矩阵表"
  - "结论部分给出明确判断与落地建议"
constraints:
  - "不产出 Office 文档"
  - "引用标明 URL"
  - "先查重后写稿"
  - "多轮 WebSearch 并行派发，不串行等待"
