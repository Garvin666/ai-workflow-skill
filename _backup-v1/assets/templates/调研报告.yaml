task_type: 调研报告
confirmed_at: 2026-09-10
goal: 按指定主题调研主流开源方案，产出 Markdown 调研报告
deliverable: tasks/<任务类型>-<日期>/调研-<主题>-<日期>.md
acceptance:
  - 每方向 >=2 个代表项目
  - 既有资料盘点表 + 开源项目对比表（含 GitHub API 实测 star/许可证/活跃度）
  - 面向目标场景的落地建议与避坑清单
constraints:
  - 只调研不写代码
  - 中文，引用标明来源
  - 倾向本地部署/免费方案
flow: 澄清确认 → 并行检索(>=3方向并行) → GitHub API 实测 → 报告 → 自检交付
